name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --include=optional
      - name: Build application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyA0YUIpIDh4WB4p1ewiNB0XfwHve0ByljU
          VITE_FIREBASE_AUTH_DOMAIN: abnreport-fd733.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: abnreport-fd733
          VITE_FIREBASE_STORAGE_BUCKET: abnreport-fd733.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '349748947315'
          VITE_FIREBASE_APP_ID: 1:349748947315:web:010cb671d2a95bcf1f7d06
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static-app

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

